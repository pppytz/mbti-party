<style>
/* ========== 全局重置 ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-1: #ffeef5;
  --bg-2: #e8f4ff;
  --bg-3: #fff5e6;
  --primary: #ff6b9d;
  --primary-light: #ffc4d6;
  --secondary: #74b9ff;
  --secondary-light: #c5e3ff;
  --accent: #ffe066;
  --accent-2: #a8e6cf;
  --purple: #b794f6;
  --text-main: #4a3a4a;
  --text-light: #8a7a8a;
  --card-shadow: 0 8px 32px rgba(255, 107, 157, 0.15);
  --card-shadow-2: 0 4px 24px rgba(116, 185, 255, 0.12);
  --radius: 20px;
  --radius-sm: 12px;
}

html { font-size: 16px; }

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
  background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
  min-height: 100vh;
  color: var(--text-main);
  line-height: 1.6;
  overflow-x: hidden;
}

/* ========== 背景装饰 ========== */
.bg-decor {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.bg-decor span {
  position: absolute; font-size: 2rem; opacity: 0.35; animation: floatUp 18s linear infinite;
}
.bg-decor span:nth-child(1) { left: 8%; top: 10%; animation-delay: 0s; }
.bg-decor span:nth-child(2) { left: 25%; top: 5%; animation-delay: 3s; }
.bg-decor span:nth-child(3) { left: 50%; top: 15%; animation-delay: 6s; }
.bg-decor span:nth-child(4) { left: 75%; top: 8%; animation-delay: 9s; }
.bg-decor span:nth-child(5) { left: 90%; top: 20%; animation-delay: 12s; }
.bg-decor span:nth-child(6) { left: 15%; top: 60%; animation-delay: 2s; }
.bg-decor span:nth-child(7) { left: 60%; top: 70%; animation-delay: 5s; }
.bg-decor span:nth-child(8) { left: 85%; top: 55%; animation-delay: 8s; }
@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); opacity: 0.35; }
  50% { opacity: 0.2; }
  100% { transform: translateY(-120px) rotate(15deg); opacity: 0; }
}

/* ========== 页面容器 ========== */
.page {
  display: none;
  position: relative; z-index: 1;
  min-height: 100vh;
  padding: 24px 16px 60px;
  animation: fadeIn 0.4s ease;
}
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.container { max-width: 600px; margin: 0 auto; }

/* ========== 首页 ========== */
#page-home { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
.home-logo { font-size: 3.5rem; margin-bottom: 8px; animation: bounce 2s ease infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.home-title {
  font-size: 2rem; font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
}
.home-subtitle { font-size: 1rem; color: var(--text-light); margin-bottom: 32px; }

.home-buttons { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 320px; }

/* ========== 按钮 ========== */
.btn {
  border: none; cursor: pointer; border-radius: var(--radius);
  font-family: inherit; font-weight: 700; font-size: 1rem;
  padding: 16px 32px; transition: all 0.25s ease; position: relative; overflow: hidden;
}
.btn:active { transform: scale(0.96); }
.btn-primary {
  background: linear-gradient(135deg, var(--primary), #ff8fab);
  color: #fff; box-shadow: 0 6px 20px rgba(255, 107, 157, 0.35);
}
.btn-primary:hover { box-shadow: 0 8px 28px rgba(255, 107, 157, 0.45); transform: translateY(-2px); }
.btn-secondary {
  background: linear-gradient(135deg, var(--secondary), #91d4ff);
  color: #fff; box-shadow: 0 6px 20px rgba(116, 185, 255, 0.35);
}
.btn-secondary:hover { box-shadow: 0 8px 28px rgba(116, 185, 255, 0.45); transform: translateY(-2px); }
.btn-ghost {

}
.btn-ghost:hover { border-color: var(--primary); background: rgba(255,107,157,0.06); }
.btn-small { padding: 10px 20px; font-size: 0.875rem; border-radius: var(--radius-sm); }

/* ========== 答题页 ========== */
.quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.quiz-progress { font-size: 0.85rem; color: var(--text-light); font-weight: 600; }
.quiz-nickname { font-size: 0.85rem; color: var(--text-light); }

.progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.6); border-radius: 100px; overflow: hidden; margin-bottom: 28px; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 100px; transition: width 0.4s ease; }

.quiz-card {
  background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
  border-radius: var(--radius); padding: 36px 24px;
  box-shadow: var(--card-shadow); text-align: center;
}
.quiz-emoji { font-size: 2.5rem; margin-bottom: 16px; }
.quiz-question { font-size: 1.15rem; font-weight: 600; color: var(--text-main); margin-bottom: 28px; line-height: 1.7; }

.quiz-options { display: flex; flex-direction: column; gap: 14px; }
.quiz-option {
  background: rgba(255,255,255,0.6); border: 2px solid rgba(255, 107, 157, 0.12);
  border-radius: var(--radius-sm); padding: 18px 20px; cursor: pointer;
  font-family: inherit; font-size: 0.95rem; color: var(--text-main); text-align: left;
  transition: all 0.2s ease; line-height: 1.5;
}
.quiz-option:hover { border-color: var(--primary); background: rgba(255,107,157,0.05); transform: translateX(4px); }
.quiz-option:active { transform: scale(0.98); }

/* ========== 结果页 ========== */
.result-card {
  background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
  border-radius: var(--radius); box-shadow: var(--card-shadow);
  padding: 36px 24px; text-align: center; margin-bottom: 20px;
  position: relative; overflow: hidden;
}
.result-card::before {
  content: ''; position: absolute; top: -40px; right: -40px;
  width: 120px; height: 120px; border-radius: 50%;
  background: var(--accent); opacity: 0.3;
}
.result-emoji { font-size: 4rem; margin-bottom: 12px; position: relative; z-index: 1; }
.result-type {
  font-size: 2.2rem; font-weight: 800; letter-spacing: 3px; margin-bottom: 4px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  position: relative; z-index: 1;
}
.result-nickname { font-size: 1.1rem; font-weight: 600; color: var(--text-light); margin-bottom: 24px; position: relative; z-index: 1; }

.result-dimensions { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; position: relative; z-index: 1; }
.dim-tag { padding: 6px 14px; border-radius: 100px; font-size: 0.8rem; font-weight: 700; }
.dim-ei { background: var(--primary-light); color: #c2185b; }
.dim-sn { background: var(--secondary-light); color: #1565c0; }
.dim-tf { background: #ffd6e0; color: #c2185b; }
.dim-jp { background: #d4edda; color: #2e7d32; }

.result-descriptions { text-align: left; position: relative; z-index: 1; }
.result-descriptions h3 { font-size: 0.95rem; color: var(--text-light); margin-bottom: 14px; text-align: center; }
.result-descriptions ul { list-style: none; }
.result-descriptions li {
  background: rgba(255,255,255,0.5); border-radius: var(--radius-sm);
  padding: 12px 16px; margin-bottom: 10px; font-size: 0.9rem; line-height: 1.6;
  display: flex; align-items: flex-start; gap: 8px;
}
.result-descriptions li .li-emoji { flex-shrink: 0; }

.result-code-box {
  background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
  border-radius: var(--radius); box-shadow: var(--card-shadow-2);
  padding: 24px 20px; margin-bottom: 20px; text-align: center;
}
.result-code-box h3 { font-size: 0.95rem; color: var(--text-light); margin-bottom: 12px; }
.code-display {
  background: linear-gradient(135deg, #f0f0f5, #e8e8f5);
  border: 2px dashed var(--primary); border-radius: var(--radius-sm);
  padding: 14px 16px; font-family: "Courier New", monospace; font-size: 1.05rem;
  font-weight: 700; color: var(--primary); letter-spacing: 1px; margin-bottom: 14px;

}
.code-tip { font-size: 0.8rem; color: var(--text-light); margin-top: 10px; }

.result-actions { display: flex; flex-direction: column; gap: 12px; }

/* ========== 导入页 ========== */
.import-card {
  background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
  border-radius: var(--radius); box-shadow: var(--card-shadow);
  padding: 28px 20px; margin-bottom: 20px;
}
.import-card h2 { font-size: 1.2rem; margin-bottom: 8px; text-align: center; }
.import-card .sub { font-size: 0.85rem; color: var(--text-light); text-align: center; margin-bottom: 20px; }

.import-input-group { margin-bottom: 16px; }
.import-input-group label { display: block; font-size: 0.85rem; color: var(--text-light); margin-bottom: 6px; font-weight: 600; }
.import-input {
  width: 100%; border: 2px solid rgba(255,107,157,0.15); border-radius: var(--radius-sm);
  padding: 12px 16px; font-family: inherit; font-size: 0.95rem; background: rgba(255,255,255,0.6);
  transition: border-color 0.2s; margin-bottom: 12px;
}
.import-input:focus { outline: none; border-color: var(--primary); }

.imported-list { margin-bottom: 16px; }
.imported-list-title { font-size: 0.85rem; color: var(--text-light); margin-bottom: 10px; font-weight: 600; }
.imported-item {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.6); border-radius: var(--radius-sm);
  padding: 10px 16px; margin-bottom: 8px; font-size: 0.9rem;
}
.imported-item .info { display: flex; align-items: center; gap: 8px; }
.imported-item .type-badge { font-weight: 700; color: var(--primary); }
.imported-item .del-btn { background: none; border: none; color: #e57373; cursor: pointer; font-size: 1.1rem; padding: 4px 8px; }
.imported-item .del-btn:hover { color: #d32f2f; }
.empty-hint { font-size: 0.85rem; color: var(--text-light); text-align: center; padding: 16px; }

.import-actions { display: flex; gap: 12px; }
.import-actions .btn { flex: 1; }

/* ========== 排行榜页 ========== */
.rank-header { text-align: center; margin-bottom: 24px; }
.rank-title { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.rank-subtitle { font-size: 0.9rem; color: var(--text-light); margin-top: 4px; }

.rank-card {
  background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
  border-radius: var(--radius); box-shadow: var(--card-shadow-2);
  padding: 24px 20px; margin-bottom: 16px;
}
.rank-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.rank-card h3 .icon { font-size: 1.4rem; }

.rank-list { display: flex; flex-direction: column; gap: 10px; }
.rank-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.5); transition: transform 0.2s;
}
.rank-item:first-child { background: linear-gradient(135deg, rgba(255,224,102,0.25), rgba(255,107,157,0.12)); border: 2px solid rgba(255,224,102,0.4); }
.rank-item:nth-child(2) { background: linear-gradient(135deg, rgba(200,200,200,0.2), rgba(116,185,255,0.08)); }
.rank-item:nth-child(3) { background: linear-gradient(135deg, rgba(210,160,100,0.12), rgba(255,224,102,0.06)); }

.rank-pos { font-size: 1.3rem; font-weight: 800; width: 36px; text-align: center; flex-shrink: 0; }
.rank-pos.gold { color: #f9a825; }
.rank-pos.silver { color: #9e9e9e; }
.rank-pos.bronze { color: #b8845b; }

.rank-name { font-weight: 600; flex: 1; min-width: 0; }
.rank-label { font-size: 0.8rem; color: var(--text-light); font-weight: 400; }
.rank-type { font-size: 0.85rem; font-weight: 700; color: var(--primary); }

.rank-actions { display: flex; gap: 12px; margin-top: 8px; }
.rank-actions .btn { flex: 1; }

/* ========== Toast ========== */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(74, 58, 74, 0.92); color: #fff; padding: 12px 24px;
  border-radius: 100px; font-size: 0.9rem; z-index: 9999;
  opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }

/* ========== 通用 ========== */
.section-title { font-size: 0.85rem; color: var(--text-light); font-weight: 600; margin: 24px 0 10px; text-align: center; }
.top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
</style>
</head>

function randomNickname() {
  return NICKNAME_POOL[Math.floor(Math.random() * NICKNAME_POOL.length)]
    + (Math.floor(Math.random() * 90) + 10);
}
function startQuiz() {
  quizState.nickname = randomNickname();
  quizState.answers = [];
  quizState.currentQ = 0;
  quizState.scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  document.getElementById('quiz-name-display').textContent = '🧑 ' + quizState.nickname;
  showPage('page-quiz');
  renderQuestion();
}

/* ========== 8. 渲染题目 ========== */
function renderQuestion() {
  const q = QUESTIONS[quizState.currentQ];
  const total = QUESTIONS.length;
  document.getElementById('quiz-progress').textContent = `${quizState.currentQ + 1} / ${total}`;
  document.getElementById('progress-fill').style.width = `${((quizState.currentQ + 1) / total) * 100}%`;
  document.getElementById('quiz-emoji').textContent = q.emoji;
  document.getElementById('quiz-question').textContent = q.q;

  const optsDiv = document.getElementById('quiz-options');
  optsDiv.innerHTML = '';
  [q.a, q.b].forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = opt.text;
    btn.onclick = () => answerQuestion(opt.val);
    optsDiv.appendChild(btn);
  });
}

/* ========== 9. 回答问题 ========== */
function answerQuestion(val) {
  quizState.scores[val]++;
  quizState.answers.push(val);
  quizState.currentQ++;
  if (quizState.currentQ < QUESTIONS.length) {
    renderQuestion();
  } else {
    calculateResult();
  }
}

/* ========== 10. 计算结果 ========== */
function calculateResult() {
  const s = quizState.scores;
  let type = '';
  type += (s.E >= s.I) ? 'E' : 'I';
  type += (s.S >= s.N) ? 'S' : 'N';
  type += (s.T >= s.F) ? 'T' : 'F';
  type += (s.J >= s.P) ? 'J' : 'P';
  quizState.resultType = type;

  // 生成结果码
  const code = generateCode(type, quizState.nickname);
  myResult = { type, nickname: quizState.nickname, code };

  // 保存到 localStorage
  try {
    localStorage.setItem('mbti_party_result', JSON.stringify(myResult));
  } catch(e) {}

  // 显示结果
  renderResult(type);
  document.getElementById('btn-history').style.display = '';
  showPage('page-result');
}

/* ========== 11. 生成结果码 ========== */
function generateCode(type, nickname) {
  // 格式: MBTI-TYPE-XXXX (XXXX是nickname的4位hex编码，支持中文)
  let nameCode = '';
  for (let i = 0; i < nickname.length; i++) {
    nameCode += nickname.charCodeAt(i).toString(16).padStart(4, '0');
  }
  if (!nameCode) nameCode = '0000';
  return `MBTI-${type}-${nameCode}`;
}

/* ========== 12. 解码结果码 ========== */
function decodeCode(code) {
  code = code.trim().toUpperCase();
  const m = code.match(/^MBTI-([A-Z]{4})-([0-9A-F]+)$/);
  if (!m) return null;
  const type = m[1];
  if (!MBTI_DATA[type]) return null;
  const hex = m[2];
  let nickname = '';
  for (let i = 0; i < hex.length; i += 4) {
    nickname += String.fromCharCode(parseInt(hex.substr(i, 4), 16));
  }
  return { type, nickname: nickname || '匿名用户' };
}

/* ========== 13. 渲染结果页 ========== */
function renderResult(type) {
  const data = MBTI_DATA[type];
  document.getElementById('result-emoji').textContent = data.emoji;
  document.getElementById('result-type').textContent = type;
  document.getElementById('result-nickname').textContent = data.nickname;

  // 维度标签
  const dimsDiv = document.getElementById('result-dimensions');
  dimsDiv.innerHTML = '';
  const dimLabels = [
    { cls:'dim-ei', label: type[0]==='E'?'外向 E':'内向 I' },
    { cls:'dim-sn', label: type[1]==='S'?'实感 S':'直觉 N' },
    { cls:'dim-tf', label: type[2]==='T'?'思考 T':'情感 F' },
    { cls:'dim-jp', label: type[3]==='J'?'判断 J':'感知 P' },
  ];
  dimLabels.forEach(d => {
    const tag = document.createElement('span');
    tag.className = `dim-tag ${d.cls}`;
    tag.textContent = d.label;
    dimsDiv.appendChild(tag);
  });

  // 描述列表
  const descUl = document.getElementById('result-desc-list');
  descUl.innerHTML = '';
  data.desc.forEach(d => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="li-emoji">💫</span><span>${d}</span>`;
    descUl.appendChild(li);
  });

  // 结果码
  document.getElementById('result-code').textContent = myResult ? myResult.code : generateCode(type, quizState.nickname || '匿名用户');
}

/* ========== 14. 复制结果码 ========== */
function copyCode() {
  const code = document.getElementById('result-code').textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(() => showToast('结果码已复制！快发给朋友吧~'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('结果码已复制！快发给朋友吧~'); }
    catch(e) { showToast('复制失败，请手动复制~'); }
    document.body.removeChild(ta);
  }
}

/* ========== 16. 导入页逻辑 ========== */
function addImport() {
  const nameInput = document.getElementById('import-name');
  const codeInput = document.getElementById('import-code');
  const code = codeInput.value.trim();
  if (!code) { showToast('请先粘贴结果码~'); return; }
  const decoded = decodeCode(code);
  if (!decoded) { showToast('结果码格式不对，检查一下~'); return; }
  // 使用输入的昵称或码中的昵称
  const customName = nameInput.value.trim();
  const member = {
    type: decoded.type,
    nickname: customName || decoded.nickname || '匿名用户',
    code: code.toUpperCase(),
  };
  // 检查是否已存在
  if (importedMembers.some(m => m.code === member.code && m.nickname === member.nickname)) {
    showToast('已经添加过了~'); return;
  }
  importedMembers.push(member);
  nameInput.value = '';
  codeInput.value = '';
  showToast('添加成功！继续加下一个人~');
  renderImported();
}

function renderImported() {
  const card = document.getElementById('imported-card');
  const listDiv = document.getElementById('imported-list');
  if (importedMembers.length === 0) {
    card.style.display = 'none';
    return;
  }
  card.style.display = '';
  listDiv.innerHTML = '';
  importedMembers.forEach((m, idx) => {
    const item = document.createElement('div');
    item.className = 'imported-item';
    item.innerHTML = `
      <div class="info">
        <span>${m.nickname}</span>
        <span class="type-badge">${m.type}</span>
      </div>
      <button class="del-btn" onclick="removeImport(${idx})">✕</button>
    `;
    listDiv.appendChild(item);
  });
}

function removeImport(idx) {
  importedMembers.splice(idx, 1);
  renderImported();
}

function clearImports() {
  importedMembers = [];
  renderImported();
  showToast('已清空~');
}

  RANK_CATEGORIES.forEach(cat => {
    // 筛选出该维度方向的人
    const candidates = importedMembers.filter(m => m.type.includes(cat.dir));
    if (candidates.length === 0) return;

    // 按维度得分排序（同方向内，看谁的倾向更极端）
    // 简单处理：按名字排序，取前3
    const sorted = candidates.sort((a, b) => {
      const aScore = getDimScore(a.type, cat.dim, cat.dir);
      const bScore = getDimScore(b.type, cat.dim, cat.dir);
      return bScore - aScore; // 不分先后，随机性为主
    });

    const card = document.createElement('div');
    card.className = 'rank-card';
    let html = `<h3><span class="icon">${cat.icon}</span> ${cat.title}</h3>`;
    html += `<div class="rank-list">`;

    sorted.forEach((m, i) => {
      if (i > 2) return; // 只显示前3
      let posClass = '';
      let posEmoji = '';
      if (i === 0) { posClass = 'gold'; posEmoji = '🥇'; }
      else if (i === 1) { posClass = 'silver'; posEmoji = '🥈'; }
      else if (i === 2) { posClass = 'bronze'; posEmoji = '🥉'; }
      const subLabel = (i === 0) ? cat.label : '';
      html += `
        <div class="rank-item">
          <div class="rank-pos ${posClass}">${posEmoji}</div>
          <div class="rank-name">
            ${m.nickname}
            ${subLabel ? `<div class="rank-label">${subLabel}</div>` : ''}
          </div>
          <div class="rank-type">${m.type}</div>
        </div>
      `;
    });

    html += `</div>`;
    card.innerHTML = html;
    cardsDiv.appendChild(card);
  });

  // 如果没有任何维度匹配（不太可能）
  if (cardsDiv.children.length === 0) {
    cardsDiv.innerHTML = `<div class="rank-card"><p style="text-align:center;color:var(--text-light)">暂无可生成的排行榜数据</p></div>`;
  }

  showPage('page-ranking');
}

/* 获取某人在某维度某方向的"强度"（简单实现：用类型中该字母的确定性） */
function getDimScore(type, dim, dir) {
  // 简单返回1，因为没有每题的详细分数
  // 实际可用于排序的只有类型，同类型的人用随机排序
  return 1 + Math.random();
}

/* ========== 18. 初始化 ========== */
(function init() {
  // 恢复历史结果
  try {
    const saved = localStorage.getItem('mbti_party_result');
    if (saved) {
      myResult = JSON.parse(saved);
      document.getElementById('btn-history').style.display = '';
    }
  } catch(e) {}
})();
</script>
